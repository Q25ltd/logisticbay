name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/logisticbay_test
      JWT_ACCESS_SECRET: ci-access-secret-32-chars-xxxxxxxxx
      JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-xxxxxxxx
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: logisticbay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API deps
        run: npm ci --prefix api

      - name: Typecheck
        run: cd api && npx tsc --noEmit

      - name: Check vocab sync
        run: npm run check:vocab

      - name: Apply migrations
        run: cd api && npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run integration tests
        run: npm test --prefix api
